<!DOCTYPE html>
<!--
  Autor: Miguel Victorio Villalon
  Fecha: 16/11/2026
  Ejercicio: E03 - Caza el error

  Problemas corregidos:
  1. <html> no tenía el atributo lang -> lang="es".
  2. <HTML> en mayúsculas -> <html> en minúsculas (buena práctica).
  3. Faltaba <meta charset="UTF-8"> en el head.
  4. <p>Bienvenidos</p> estaba dentro del head -> movido al body.
  5. <h1> se cerraba con </h2> -> cerrado con </h1>.
  6. <strong> y <p> mal anidados -> </strong></p> en el orden correcto.
  7. href=web.html sin comillas -> href="web.html".
  8. Faltaba la etiqueta de cierre </html> al final.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Errores</title>
  </head>
  <body>
    <p>Bienvenidos</p>
    <h1>Mi página</h1>
    <p>Texto en <strong>negrita</strong></p>
    <a href="web.html">Enlace</a>
  <p><a href="../../index.html">Volver al inicio</a></p>
  </body>
</html>
